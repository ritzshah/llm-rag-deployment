apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bootstrap
  namespace: openshift-gitops
spec:
  generators:
  - list:
      elements:
      # RHOAI operator/installation/configuration removed - handled by AgnosticV workload
      - cluster: in-cluster
        name: ic-shared-minio-app
        repoURL: https://github.com/rhpds/llm-rag-deployment.git
        targetRevision: litemaas-update
        path: bootstrap-helm/ic-shared-minio
      - cluster: in-cluster
        name: ic-shared-database-app
        repoURL: https://github.com/rhpds/llm-rag-deployment.git
        targetRevision: litemaas-update
        path: bootstrap-helm/ic-shared-database
      # Milvus removed - using PGVector for this demo
      - cluster: in-cluster
        name: ic-shared-llm-app
        repoURL: https://github.com/rhpds/llm-rag-deployment.git
        targetRevision: litemaas-update
        path: bootstrap-helm/ic-shared-llm
      - cluster: in-cluster
        name: ic-shared-app-app
        repoURL: https://github.com/rhpds/llm-rag-deployment.git
        targetRevision: litemaas-update
        path: bootstrap-helm/ic-shared-app
      # Image detection removed - not needed for this demo
      # User projects removed - handled by AgnosticV workload
      - cluster: in-cluster
        name: gradio-app
        repoURL: https://github.com/rhpds/llm-rag-deployment.git
        targetRevision: litemaas-update
        path: bootstrap-helm/gradio
      - cluster: in-cluster
        name: pgvector-deployment-app
        repoURL: https://github.com/rhpds/llm-rag-deployment.git
        targetRevision: litemaas-update
        path: bootstrap-helm/pgvector-deployment
  template:
    metadata:
      name: '{{`{{name}}`}}'
      namespace: openshift-gitops
      labels:
        component: bootstrap
        purpose: '{{`{{name}}`}}'
    spec:
      project: default
      source:
        repoURL: '{{`{{repoURL}}`}}'
        targetRevision: '{{`{{targetRevision}}`}}'
        path: '{{`{{path}}`}}'
      destination:
        server: 'https://kubernetes.default.svc'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - RespectIgnoreDifferences=true