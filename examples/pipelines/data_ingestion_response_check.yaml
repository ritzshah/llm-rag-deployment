        taskInfo:
          name: data-ingestion
      data-query:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-data-query
        dependentTasks:
        - data-ingestion
        taskInfo:
          name: data-query
      summarize:
        cachingOptions:
