deploymentSpec:
  executors:
    exec-data-ingestion:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - data_ingestion
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef data_ingestion(\n    minio_endpoint: str = \"http://minio.ic-shared-rag-minio.svc:9000\"\
          ,\n    minio_bucket: str = \"pipeline\",\n    cos_directory: str = \"pipeline-code\"\
          ,\n):\n    \"\"\"Run the Langchain-PgVector-Ingest notebook via Elyra bootstrapper.\"\
          \"\"\n    import subprocess, os\n    os.environ[\"HOME\"] = \"/tmp\"\n \
          \   os.makedirs(\"/tmp/jupyter-work-dir\", exist_ok=True)\n    os.chdir(\"\
          /tmp/jupyter-work-dir\")\n\n    # Download bootstrapper\n    subprocess.run([\n\
          \        \"curl\", \"--fail\", \"-H\", \"Cache-Control: no-cache\", \"-L\"\
          ,\n        \"file:///opt/app-root/bin/utils/bootstrapper.py\",\n       \
          \ \"--output\", \"bootstrapper.py\"\n    ], check=True)\n    subprocess.run([\n\
          \        \"curl\", \"--fail\", \"-H\", \"Cache-Control: no-cache\", \"-L\"\
          ,\n        \"file:///opt/app-root/bin/utils/requirements-elyra.txt\",\n\
          \        \"--output\", \"requirements-elyra.txt\"\n    ], check=True)\n\n\
          \    subprocess.run([\"python3\", \"-m\", \"pip\", \"install\", \"packaging\"\
          ], check=True)\n    subprocess.run([\"python3\", \"-m\", \"pip\", \"freeze\"\
          ], stdout=open(\"requirements-current.txt\", \"w\"))\n    subprocess.run([\n\
          \        \"python3\", \"bootstrapper.py\",\n        \"--pipeline-name\"\
          , \"data_ingestion_pipeline\",\n        \"--cos-endpoint\", minio_endpoint,\n\
          \        \"--cos-bucket\", minio_bucket,\n        \"--cos-directory\", cos_directory,\n\
          \        \"--cos-dependencies-archive\", \"Langchain-PgVector-Ingest.tar.gz\"\
          ,\n        \"--file\", \"llm-rag-deployment/examples/pipelines/Langchain-PgVector-Ingest.ipynb\"\
          ,\n    ], check=True, env={\n        **os.environ,\n        \"ELYRA_RUNTIME_ENV\"\
          : \"kfp\",\n        \"ELYRA_ENABLE_PIPELINE_INFO\": \"True\",\n        \"\
          ELYRA_WRITABLE_CONTAINER_DIR\": \"/tmp\",\n    })\n\n"
        env:
        - name: AWS_ACCESS_KEY_ID
          value: minio
        - name: AWS_SECRET_ACCESS_KEY
          value: minio123
        image: quay.io/modh/runtime-images@sha256:7dd23e58291cad7a0ab4a8e04bda06492f2c027eb33b226358380db58dcdd60b
